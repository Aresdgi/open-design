name: github-metrics

on:
  schedule:
    # Runs daily at 00:15 UTC; output is committed to docs/assets/github-metrics.svg.
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  metrics:
    name: Generate repository metrics SVG
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub repository metrics
        uses: lowlighter/metrics@latest
        with:
          # Output path; the action opens/updates a PR when this file changes.
          # Requires manual review to merge. If metrics unchanged, no PR is created.
          filename: docs/assets/github-metrics.svg

          # Auth: METRICS_TOKEN may be provided for higher API limits. The
          # repository also allows GITHUB_TOKEN to create the scheduled refresh PR.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          output_action: pull-request
          output_condition: data-changed

          # Use the repository template (per-repo metrics, not user metrics).
          # Keep this dynamic so forks render their own repository instead of the
          # upstream owner repository.
          template: repository
          base: ''
          user: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}

          # Plugins. Avoid traffic metrics because the default Actions token cannot
          # read repository traffic and the action fails hard instead of no-oping.
          plugin_contributors: yes
          plugin_contributors_categories: |
            {
              "Skills": "skills/**",
              "Design systems": "design-systems/**",
              "Web": "apps/web/**",
              "Daemon": "apps/daemon/**",
              "Docs": "docs/**"
            }
          plugin_followup: yes
          plugin_followup_sections: pr, issue
          plugin_languages: yes
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_traffic: no
          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist

          config_timezone: Asia/Shanghai
          config_display: large
